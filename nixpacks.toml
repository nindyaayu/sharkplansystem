[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo_mysql", "nodejs", "composer"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install",
  "npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan storage:link && php artisan optimize:clear && php artisan octane:start --server=frankenphp --host=0.0.0.0 --admin-port=2019 --port=${PORT:-8000}"